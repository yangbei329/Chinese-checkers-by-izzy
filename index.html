<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategic Network: Ultimate Victory Arena</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --accent-gold: #d4af37;
            --accent-blue: #58a6ff;
            --border-color: #30363d;
        }
        body {
            margin: 0;
            background-color: var(--bg-color);
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 600px;
            width: 100%;
            position: relative;
            z-index: 10;
        }
        h1 { font-size: 22px; letter-spacing: 2px; color: #ffffff; margin: 0 0 5px 0; text-transform: uppercase; }
        .subtitle { font-size: 11px; color: #8b949e; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        #status-panel {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            border-left: 4px solid var(--accent-gold);
            margin-bottom: 15px;
            text-align: left;
            font-weight: bold;
        }
        svg { background: #070a0e; border-radius: 12px; border: 1px solid #21262d; max-width: 100%; height: auto; }
        .slot { fill: #171b22; stroke: #2d333b; stroke-width: 1.5; cursor: pointer; transition: all 0.2s; }
        .slot:hover { fill: #30363d; }
        .slot.selected { stroke: var(--accent-gold); stroke-width: 3; fill: #1f242c; }
        .slot.valid-target { fill: rgba(88, 166, 255, 0.2); stroke: var(--accent-blue); stroke-dasharray: 4; }
        .piece-user { fill: url(#goldGradient); filter: drop-shadow(0px 3px 4px rgba(0,0,0,0.6)); cursor: pointer; }
        .piece-ai { fill: url(#blueGradient); filter: drop-shadow(0px 3px 4px rgba(0,0,0,0.6)); cursor: pointer; }
        
        #fireworks {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
        }
        #victory-modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, #1a1f29 0%, #0a0d14 100%);
            border: 3px solid var(--accent-gold);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 60px rgba(212, 175, 55, 0.8);
            z-index: 1000;
            text-align: center;
            animation: popup 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popup { from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
        #victory-modal h2 { color: var(--accent-gold); font-size: 36px; margin: 0 0 15px 0; text-shadow: 0 0 15px rgba(212,175,55,0.6); }
        #victory-modal p { font-size: 20px; color: #ffffff; line-height: 1.8; margin-bottom: 20px; }
        .restart-btn { background: var(--accent-gold); color: #000; border: none; padding: 10px 25px; font-weight: bold; font-size: 16px; border-radius: 8px; cursor: pointer; transition: transform 0.2s; }
        .restart-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>

<canvas id="fireworks"></canvas>

<div class="container">
    <h1>Strategic Network</h1>
    <div class="subtitle">10-Piece Tactical Grid Arena</div>
    
    <div id="status-panel">
        <span style="color: #8b949e;">[SYSTEM]</span> <span id="status-text">终极修正版就绪。双方各有10个棋子，请指派底部的金色核心。</span>
    </div>

    <svg id="board-svg" width="560" height="580" viewBox="0 0 560 580">
        <defs>
            <radialGradient id="goldGradient" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#fff3ad" />
                <stop offset="70%" stop-color="#d4af37" />
                <stop offset="100%" stop-color="#aa8413" />
            </radialGradient>
            <radialGradient id="blueGradient" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#a5d1ff" />
                <stop offset="70%" stop-color="#388bfd" />
                <stop offset="100%" stop-color="#0c44ac" />
            </radialGradient>
        </defs>
        <g id="lines-layer"></g>
        <g id="slots-layer"></g>
    </svg>
</div>

<div id="victory-modal">
    <h2>🎉 恭喜长官！达成至高胜利！ 🎉</h2>
    <p>🏆 战术网络分析：您展现了完美无瑕的统帅级操作！<br><span style="color: var(--accent-gold); font-weight: bold;">10个金色核心已全部完美攻占顶端老巢！最高算力向您的智慧致敬！🎇🎆</span></p>
    <button class="restart-btn" onclick="location.reload()">再来一局</button>
</div>

<script>
    const slotsLayer = document.getElementById('slots-layer');
    const linesLayer = document.getElementById('lines-layer');
    const statusText = document.getElementById('status-text');
    const victoryModal = document.getElementById('victory-modal');

    const nodes = [];
    let idCounter = 0;
    const R = 22; 
    const cx = 280; const cy = 290;

    // 17行绝对完美六角星点位映射
    const starLayout = [
        {r: 0, count: 1, start: 0}, {r: 1, count: 2, start: -0.5}, {r: 2, count: 3, start: -1}, {r: 3, count: 4, start: -1.5},
        {r: 4, count: 13, start: -6}, {r: 5, count: 12, start: -5.5}, {r: 6, count: 11, start: -5}, {r: 7, count: 10, start: -4.5},
        {r: 8, count: 9, start: -4}, {r: 9, count: 10, start: -4.5}, {r: 10, count: 11, start: -5}, {r: 11, count: 12, start: -5.5},
        {r: 12, count: 13, start: -6}, {r: 13, count: 4, start: -1.5}, {r: 14, count: 3, start: -1}, {r: 15, count: 2, start: -0.5}, {r: 16, count: 1, start: 0}
    ];

    const dy = R * Math.sqrt(3);

    starLayout.forEach((rowInfo) => {
        const y = cy + (rowInfo.r - 8) * dy;
        for (let i = 0; i < rowInfo.count; i++) {
            const x = cx + (rowInfo.start + i) * (R * 2);
            
            // 【棋子和目标槽完美绑定】
            let piece = null;
            if (rowInfo.r <= 3) piece = 'AI';       // 顶部4行正好是 1+2+3+4 = 10 个蓝色AI棋子
            if (rowInfo.r >= 13) piece = 'USER';    // 底部4行正好是 4+3+2+1 = 10 个金色玩家棋子

            nodes.push({ id: idCounter++, x, y, row: rowInfo.r, col: i, piece });
        }
    });

    // 建立标准6向邻居网络
    for (let i = 0; i < nodes.length; i++) {
        nodes[i].neighbors = [];
        for (let j = 0; j < nodes.length; j++) {
            if (i === j) continue;
            const dist = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].y - nodes[j].y);
            if (dist > 10 && dist < (R * 2) + 5) {
                nodes[i].neighbors.push(nodes[j]);
            }
        }
    }

    // 绘制连线
    nodes.forEach(n => {
        n.neighbors.forEach(nb => {
            if (n.id < nb.id) {
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", n.x); line.setAttribute("y1", n.y);
                line.setAttribute("x2", nb.x); line.setAttribute("y2", nb.y);
                line.setAttribute("stroke", "#1c212b"); line.setAttribute("stroke-width", "1");
                linesLayer.appendChild(line);
            }
        });
    });

    let selectedNode = null; let validMoves = [];

    function render() {
        slotsLayer.innerHTML = '';
        nodes.forEach(n => {
            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", n.x); circle.setAttribute("cy", n.y); circle.setAttribute("r", 11);
            circle.setAttribute("class", "slot");
            if (selectedNode === n) circle.classList.add('selected');
            if (validMoves.includes(n)) circle.classList.add('valid-target');
            circle.onclick = () => handleNodeClick(n);
            slotsLayer.appendChild(circle);

            if (n.piece) {
                const piece = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                piece.setAttribute("cx", n.x); piece.setAttribute("cy", n.y); piece.setAttribute("r", 9);
                piece.setAttribute("class", n.piece === 'USER' ? 'piece-user' : 'piece-ai');
                piece.onclick = () => handleNodeClick(n);
                slotsLayer.appendChild(piece);
            }
        });
    }

    // 完美深度连跳算法
    function getValidMoves(startNode) {
        let moves = [];
        startNode.neighbors.forEach(nb => { if (!nb.piece) moves.push(nb); });
        let visitedJumps = new Set();
        function findJumps(currentNode) {
            currentNode.neighbors.forEach(nb => {
                if (nb.piece) {
                    const dx = nb.x - currentNode.x; const dy = nb.y - currentNode.y;
                    const targetNode = nodes.find(t => Math.abs(t.x - (nb.x + dx)) < 5 && Math.abs(t.y - (nb.y + dy)) < 5 && !t.piece);
                    if (targetNode && !visitedJumps.has(targetNode.id)) {
                        visitedJumps.add(targetNode.id); moves.push(targetNode); findJumps(targetNode);
                    }
                }
            });
        }
        findJumps(startNode);
        return moves;
    }

    function handleNodeClick(node) {
        if (node.piece === 'USER') {
            selectedNode = node; validMoves = getValidMoves(node);
            statusText.innerText = `核心路径就绪，请选择目标。`; render();
        } else if (validMoves.includes(node) && selectedNode) {
            node.piece = 'USER'; selectedNode.piece = null;
            selectedNode = null; validMoves = []; render();
            
            // 每次走完，严格检查是否把顶部的10个格子全部占满
            if (checkUserVictory()) { triggerVictory(); return; }
            
            statusText.innerText = "[SYSTEM] 决策网格同步中...";
            setTimeout(triggerAIMove, 250);
        }
    }

    // 【硬核胜利判定】检查行数 row <= 3 的 10个格子里，是不是有 10个全是你的金色棋子
    function checkUserVictory() {
        const targetSlots = nodes.filter(n => n.row <= 3);
        const userPiecesInTarget = targetSlots.filter(n => n.piece === 'USER').length;
        return userPiecesInTarget === 10;
    }

    function triggerAIMove() {
        let aiPieces = nodes.filter(n => n.piece === 'AI');
        let allPossibleMoves = [];
        aiPieces.forEach(p => {
            getValidMoves(p).forEach(m => {
                allPossibleMoves.push({ from: p, to: m, progress: m.y - p.y });
            });
        });

        if (allPossibleMoves.length === 0) return;

        // AI拼命给你在中场排队搭桥，且绝对不会进入你的底部老巢偷家
        allPossibleMoves.forEach(move => {
            let bridgeScore = 0;
            move.to.neighbors.forEach(nb => { if (nb.piece === 'USER') bridgeScore += 45; }); 
            if (move.to.row >= 13) bridgeScore -= 400; 
            move.score = move.progress + bridgeScore;
        });

        allPossibleMoves.sort((a, b) => b.score - a.score);
        const chosenMove = allPossibleMoves[0] || allPossibleMoves[Math.floor(Math.random() * allPossibleMoves.length)];

        chosenMove.to.piece = 'AI'; chosenMove.from.piece = null;
        render();
        
        if (checkUserVictory()) { triggerVictory(); return; }
        statusText.innerText = "[SYSTEM] 节点更新。等待您的下一步战术。";
    }

    // 华丽满屏礼花渲染引擎
    const canvas = document.getElementById('fireworks');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas); resizeCanvas();

    function createFirework(x, y) {
        const colors = ['#d4af37', '#ff4d4f', '#58a6ff', '#52c41a', '#fadb14', '#722ed1', '#ffffff'];
        const color = colors[Math.floor(Math.random() * colors.length)];
        for (let i = 0; i < 80; i++) {
            particles.push({
                x: x, y: y,
                angle: Math.random() * Math.PI * 2,
                speed: Math.random() * 7 + 2,
                friction: 0.94, gravity: 0.15,
                alpha: 1, decay: Math.random() * 0.015 + 0.005,
                color: color
            });
        }
    }

    function animateFireworks() {
        requestAnimationFrame(animateFireworks);
        ctx.fillStyle = 'rgba(13, 17, 23, 0.25)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.speed *= p.friction; p.x += Math.cos(p.angle) * p.speed; p.y += Math.sin(p.angle) * p.speed + p.gravity;
            p.alpha -= p.decay;
            if (p.alpha <= 0) { particles.splice(i, 1); continue; }
            ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        }
    }

    function triggerVictory() {
        statusText.innerText = "🏆 CRITICAL VICTORY DETECTED! 🎉";
        victoryModal.style.display = 'block';
        animateFireworks();
        // 疯狂生成密集礼花弹
        setInterval(() => {
            createFirework(Math.random() * canvas.width, Math.random() * canvas.height * 0.6);
        }, 200);
    }

    render();
</script>
</body>
</html>
