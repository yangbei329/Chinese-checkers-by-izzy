<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategic Network: Sector 4321</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --accent-gold: #d4af37;
            --accent-blue: #58a6ff;
            --border-color: #30363d;
        }
        body {
            margin: 0;
            background-color: var(--bg-color);
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 550px;
            width: 100%;
        }
        h1 { font-size: 22px; letter-spacing: 2px; color: #ffffff; margin: 0 0 5px 0; text-transform: uppercase; }
        .subtitle { font-size: 11px; color: #8b949e; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        #status-panel {
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            border-left: 4px solid var(--accent-gold);
            margin-bottom: 15px;
            text-align: left;
        }
        svg { background: #070a0e; border-radius: 12px; border: 1px solid #21262d; max-width: 100%; height: auto; }
        .slot { fill: #1f242c; stroke: #30363d; stroke-width: 1.5; cursor: pointer; transition: all 0.2s; }
        .slot:hover { fill: #30363d; }
        .slot.selected { stroke: var(--accent-gold); stroke-width: 3; }
        .slot.valid-target { fill: rgba(88, 166, 255, 0.15); stroke: var(--accent-blue); stroke-dasharray: 4; }
        .piece-user { fill: url(#goldGradient); filter: drop-shadow(0px 3px 4px rgba(0,0,0,0.6)); cursor: pointer; }
        .piece-ai { fill: url(#blueGradient); filter: drop-shadow(0px 3px 4px rgba(0,0,0,0.6)); cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h1>Strategic Network</h1>
    <div class="subtitle">Grid Matrix Simulation // Tactical 4321</div>
    
    <div id="status-panel">
        <span style="color: #8b949e;">[SYSTEM]</span> <span id="status-text">安全链路已建立。请指派金色核心。</span>
    </div>

    <svg id="board-svg" width="500" height="580" viewBox="0 0 500 580">
        <defs>
            <radialGradient id="goldGradient" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#fff3ad" />
                <stop offset="70%" stop-color="#d4af37" />
                <stop offset="100%" stop-color="#aa8413" />
            </radialGradient>
            <radialGradient id="blueGradient" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#a5d1ff" />
                <stop offset="70%" stop-color="#388bfd" />
                <stop offset="100%" stop-color="#0c44ac" />
            </radialGradient>
        </defs>
        <g id="lines-layer"></g>
        <g id="slots-layer"></g>
    </svg>
</div>

<script>
    const slotsLayer = document.getElementById('slots-layer');
    const linesLayer = document.getElementById('lines-layer');
    const statusText = document.getElementById('status-text');

    const nodes = [];
    let idCounter = 0;

    // 完美构建 4-3-2-1 两端对峙棋盘 (共 12 行的沙漏/钻石型延伸)
    // 行高与间距控制
    const ySpacing = 42;
    const xSpacing = 46;
    const startY = 50;

    // 每行的棋位数量布局 (完美的4321两端阵型)
    const rowLayout = [4, 3, 2, 1, 2, 3, 4, 3, 2, 1, 2, 3, 4];

    rowLayout.forEach((count, rowIndex) => {
        const startX = 250 - ((count - 1) * xSpacing) / 2;
        for (let i = 0; i < count; i++) {
            const x = startX + i * xSpacing;
            const y = startY + rowIndex * ySpacing;
            
            // 阵营划分
            let piece = null;
            if (rowIndex <= 2) piece = 'AI';      // 顶部 4, 3, 2 排布归 AI
            if (rowIndex === 3 && i === 0) piece = 'AI'; // 终点顶角也是 AI (凑满10个)
            
            if (rowIndex >= 10) piece = 'USER';   // 底部 2, 3, 4 排布归用户
            if (rowIndex === 9 && i === 0) piece = 'USER'; // 起点底角也是用户 (凑满10个)

            nodes.push({ id: idCounter++, x, y, row: rowIndex, col: i, piece });
        }
    });

    // 智能动态连线：基于几何距离建立标准的跳棋 6 方向网络
    const maxDist = xSpacing + 5; 
    for (let i = 0; i < nodes.length; i++) {
        nodes[i].neighbors = [];
        for (let j = 0; j < nodes.length; j++) {
            if (i === j) continue;
            const dist = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].y - nodes[j].y);
            // 距离接近一个步长的判定为邻居
            if (dist > 20 && dist < maxDist) {
                nodes[i].neighbors.push(nodes[j]);
            }
        }
    }

    // 绘制连线层
    const drawnLines = new Set();
    nodes.forEach(n => {
        n.neighbors.forEach(nb => {
            const pairId = [n.id, nb.id].sort().join('-');
            if (!drawnLines.has(pairId)) {
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", n.x); line.setAttribute("y1", n.y);
                line.setAttribute("x2", nb.x); line.setAttribute("y2", nb.y);
                line.setAttribute("stroke", "#1c212b");
                line.setAttribute("stroke-width", "1.5");
                linesLayer.appendChild(line);
                drawnLines.add(pairId);
            }
        });
    });

    let selectedNode = null;
    let validMoves = [];

    function render() {
        slotsLayer.innerHTML = '';
        nodes.forEach(n => {
            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", n.x); circle.setAttribute("cy", n.y); circle.setAttribute("r", 14);
            circle.setAttribute("class", "slot");
            
            if (selectedNode === n) circle.classList.add('selected');
            if (validMoves.includes(n)) circle.classList.add('valid-target');

            circle.onclick = () => handleNodeClick(n);
            slotsLayer.appendChild(circle);

            if (n.piece) {
                const piece = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                piece.setAttribute("cx", n.x); piece.setAttribute("cy", n.y); piece.setAttribute("r", 11);
                piece.setAttribute("class", n.piece === 'USER' ? 'piece-user' : 'piece-ai');
                piece.onclick = () => handleNodeClick(n);
                slotsLayer.appendChild(piece);
            }
        });
    }

    // 计算合法走法（支持单步与直线连跳）
    function getValidMoves(node) {
        let moves = [];
        // 单步
        node.neighbors.forEach(nb => {
            if (!nb.piece) moves.push(nb);
        });
        // 跳跃
        node.neighbors.forEach(nb => {
            if (nb.piece) {
                const dx = nb.x - node.x;
                const dy = nb.y - node.y;
                const targetNode = nodes.find(t => 
                    Math.abs(t.x - (nb.x + dx)) < 8 && 
                    Math.abs(t.y - (nb.y + dy)) < 8 && 
                    !t.piece
                );
                if (targetNode) moves.push(targetNode);
            }
        });
        return moves;
    }

    function handleNodeClick(node) {
        if (statusText.innerText.includes("同步中")) return;

        if (node.piece === 'USER') {
            selectedNode = node;
            validMoves = getValidMoves(node);
            statusText.innerText = `核心已锁定。指派目标信道。`;
            render();
        } else if (validMoves.includes(node) && selectedNode) {
            node.piece = 'USER';
            selectedNode.piece = null;
            selectedNode = null;
            validMoves = [];
            render();
            
            statusText.innerText = "[SYSTEM] 决策网络正在同步算力...";
            setTimeout(triggerAIMove, 400);
        }
    }

    // 智能放水 AI：主动推进，但绝不封堵，专门给玩家“送桥”
    function triggerAIMove() {
        let aiPieces = nodes.filter(n => n.piece === 'AI');
        let allPossibleMoves = [];

        aiPieces.forEach(p => {
            let moves = getValidMoves(p);
            moves.forEach(m => {
                // 计算这一步能往下走多远
                const progress = m.y - p.y;
                allPossibleMoves.push({ from: p, to: m, progress: progress });
            });
        });

        if (allPossibleMoves.length === 0) {
            statusText.innerText = "[SYSTEM] 战术网格已陷入死局。";
            return;
        }

        // 高级放水过滤：
        // 1. 过滤掉直接倒退的垃圾步（防止原地卡死）
        // 2. 优先选择那些“恰好走到玩家棋子正前方”的步子（给玩家喂棋搭桥）
        let forwardMoves = allPossibleMoves.filter(m => m.progress >= 0);
        if (forwardMoves.length === 0) forwardMoves = allPossibleMoves;

        // 寻找能给玩家“做桥”的动作（落点周围有玩家棋子）
        forwardMoves.forEach(move => {
            let bridgeScore = 0;
            move.to.neighbors.forEach(nb => {
                if (nb.piece === 'USER') bridgeScore += 10; // 靠近玩家，方便玩家跳跃
            });
            move.score = move.progress + bridgeScore;
        });

        // 按得分排序（既保证它在往前走，又保证它走得毫无威胁，甚至是在主动奉献身体）
        forwardMoves.sort((a, b) => b.score - a.score);

        // 随机从较优的喂桥动作里选一个
        const chosenMove = forwardMoves[0];

        chosenMove.to.piece = 'AI';
        chosenMove.from.piece = null;
        render();

        statusText.innerText = "[SYSTEM] 节点已更新。请调整战术。";
    }

    render();
</script>

</body>
</html>
